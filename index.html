<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내가 왕이 될 상인가? - AI 관상 도사</title>
    <!-- Tailwind CSS (디자인용) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (아이콘용) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; background-image: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 20px 20px; }
        .gradient-text { background: linear-gradient(to right, #4f46e5, #9333ea); -webkit-background-clip: text; color: transparent; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <div class="max-w-4xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 gradient-text tracking-tight">내가 왕이 될 상인가?</h1>
            <p class="text-gray-600 text-lg mb-6">최첨단 AI 기술로 당신의 관상을 냉철하게 꿰뚫어 봅니다.</p>
            
            <!-- 에러/성공 알림 영역 -->
            <div id="toast-container" class="hidden mb-6 p-3 rounded-lg max-w-md mx-auto fade-in flex items-center justify-center gap-2 border shadow-sm">
                <i id="toast-icon" class="ph-fill text-xl"></i>
                <span id="toast-message" class="font-medium"></span>
            </div>

            <!-- 사진 업로드 버튼 -->
            <div id="upload-section" class="inline-block relative">
                <input type="file" id="file-input" accept="image/*" class="hidden">
                <label for="file-input" class="cursor-pointer bg-white text-gray-700 font-medium py-3 px-6 rounded-full shadow-md hover:shadow-lg transition-all border border-gray-200 flex items-center justify-center gap-2">
                    <i class="ph-fill ph-camera text-xl text-indigo-500"></i>
                    얼굴이 정면으로 잘 나온 사진 올리기
                </label>
            </div>
        </div>

        <div id="loading-section" class="hidden text-center py-12 fade-in">
            <div class="loader mb-4"></div>
            <p class="text-lg font-bold text-indigo-600 animate-pulse">AI 관상가가 왕재(王材)인지 기운을 살피는 중입니다...</p>
            <p class="text-sm text-gray-500 mt-2">흉상(凶相)도 가감 없이 찾아내는 중... (약 5~10초 소요)</p>
        </div>

        <div id="result-section" class="hidden fade-in">
            <!-- 미리보기 이미지 -->
            <div class="flex justify-center mb-8">
                <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-lg">
                    <img id="preview-image" src="" alt="업로드한 사진" class="w-full h-full object-cover">
                </div>
            </div>

            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold flex items-center justify-center gap-2">
                    <i class="ph-fill ph-magic-wand text-purple-500"></i> 냉철한 관상 분석 결과
                </h2>
            </div>

            <!-- 3대 관상 분석 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white rounded-2xl p-6 shadow-sm border-2 border-indigo-100 hover:shadow-md transition-all">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="bg-indigo-100 p-2 rounded-full text-indigo-600"><i class="ph-fill ph-user-focus text-xl"></i></div>
                        <h3 class="text-xl font-bold text-gray-800">이마 (초년/직업)</h3>
                    </div>
                    <p id="result-forehead" class="text-gray-600 leading-relaxed text-sm">분석 중...</p>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-sm border-2 border-emerald-100 hover:shadow-md transition-all">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="bg-emerald-100 p-2 rounded-full text-emerald-600"><i class="ph-fill ph-eye text-xl"></i></div>
                        <h3 class="text-xl font-bold text-gray-800">눈썹/눈 (성격/관계)</h3>
                    </div>
                    <p id="result-eyes" class="text-gray-600 leading-relaxed text-sm">분석 중...</p>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-sm border-2 border-amber-100 hover:shadow-md transition-all">
                    <div class="flex items-center gap-2 mb-4">
                        <div class="bg-amber-100 p-2 rounded-full text-amber-600"><i class="ph-fill ph-coins text-xl"></i></div>
                        <h3 class="text-xl font-bold text-gray-800">하관/코 (말년/재물)</h3>
                    </div>
                    <p id="result-lowerFace" class="text-gray-600 leading-relaxed text-sm">분석 중...</p>
                </div>
            </div>

            <!-- 종합 풀이 -->
            <div class="bg-white rounded-2xl p-8 shadow-md text-center border border-gray-100">
                <h3 class="text-xl font-bold mb-4 flex items-center justify-center gap-2">
                    <i class="ph-fill ph-scroll text-red-600"></i> 최종 관상 총평 <i class="ph-fill ph-scroll text-red-600"></i>
                </h3>
                <p id="result-summary" class="text-gray-700 italic text-lg leading-relaxed whitespace-pre-wrap">분석 중...</p>
            </div>

            <!-- 다시하기 버튼 -->
            <div class="text-center mt-10">
                <button onclick="resetApp()" class="text-indigo-600 font-medium hover:text-indigo-800 flex items-center justify-center gap-1 mx-auto transition-colors bg-indigo-50 px-6 py-2 rounded-full">
                    <i class="ph ph-arrow-counter-clockwise"></i> 다른 사진 분석하기
                </button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const uploadSection = document.getElementById('upload-section');
        const loadingSection = document.getElementById('loading-section');
        const resultSection = document.getElementById('result-section');
        const previewImage = document.getElementById('preview-image');
        
        const toastContainer = document.getElementById('toast-container');
        const toastIcon = document.getElementById('toast-icon');
        const toastMessage = document.getElementById('toast-message');

        // 알림창 띄우기 (alert 대신 사용)
        function showToast(type, msg) {
            toastContainer.className = `mb-6 p-3 rounded-lg max-w-md mx-auto fade-in flex items-center justify-center gap-2 border shadow-sm ${
                type === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'
            }`;
            toastIcon.className = `ph-fill text-xl ${type === 'error' ? 'ph-warning-circle' : 'ph-check-circle'}`;
            toastMessage.innerText = msg;
            toastContainer.classList.remove('hidden');
        }

        // 이미지 압축 함수
        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // 파일 업로드 이벤트
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            toastContainer.classList.add('hidden');
            uploadSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');

            try {
                // 미리보기
                const reader = new FileReader();
                reader.onload = (e) => { previewImage.src = e.target.result; };
                reader.readAsDataURL(file);

                const compressedBase64 = await compressImage(file);
                const base64Data = compressedBase64.split(',')[1]; 

                // Vercel 백엔드로 안전하게 분석 요청 (이제 화면에 API 키가 필요 없습니다!)
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Data })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "서버 통신 에러가 발생했습니다.");
                }

                showResult(data);

            } catch (error) {
                console.error('분석 에러:', error);
                showToast('error', error.message);
                loadingSection.classList.add('hidden');
                uploadSection.classList.remove('hidden');
            }
        });

        // 결과 화면 출력
        function showResult(data) {
            loadingSection.classList.add('hidden');
            resultSection.classList.remove('hidden');

            document.getElementById('result-forehead').innerText = data.forehead || "분석 실패";
            document.getElementById('result-eyes').innerText = data.eyes || "분석 실패";
            document.getElementById('result-lowerFace').innerText = data.lowerFace || "분석 실패";
            document.getElementById('result-summary').innerText = `"${data.summary || "분석 실패"}"`;
        }

        function resetApp() {
            fileInput.value = '';
            resultSection.classList.add('hidden');
            loadingSection.classList.add('hidden');
            toastContainer.classList.add('hidden');
            uploadSection.classList.remove('hidden');
            
            // 다시하기를 눌러도 가장 상단으로 스크롤 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
